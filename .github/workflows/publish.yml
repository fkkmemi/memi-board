name: Publish to npm

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: npm-publish-main
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish package
    runs-on: ubuntu-latest
    environment: npm-publish

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      # Trusted Publishing은 npm CLI 11.5.1+가 필요하다. 버전을 고정해
      # runner 이미지의 번들 npm 버전 변경이 릴리스 결과에 영향을 주지 않게 한다.
      - name: Set up npm CLI
        run: npm install --global npm@12.0.2

      - name: Verify package version is not published
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if npm view "memi-board@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "memi-board@${PACKAGE_VERSION} is already published."
            echo "Bump package.json version before pushing to main."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # 컴포넌트의 self-reference(memi-board/runtime, /storage)는 build가 만든
      # dist 선언 파일을 해석하므로 깨끗한 runner에서는 build 후 검사해야 한다.
      - name: Typecheck
        run: pnpm typecheck

      - name: Inspect package
        run: npm pack --dry-run --ignore-scripts

      - name: Publish with npm Trusted Publishing
        run: npm publish --access public --ignore-scripts
