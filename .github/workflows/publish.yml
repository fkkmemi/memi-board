name: Publish to npm

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: npm-publish-main
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish package
    runs-on: ubuntu-latest
    environment: npm-publish

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      # Trusted Publishing은 npm CLI 11.5.1+가 필요하다. 버전을 고정해
      # runner 이미지의 번들 npm 버전 변경이 릴리스 결과에 영향을 주지 않게 한다.
      - name: Set up npm CLI
        run: npm install --global npm@12.0.2

      - name: Verify package version is not published
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if npm view "memi-board@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "memi-board@${PACKAGE_VERSION} is already published."
            echo "Bump package.json version before pushing to main."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # 컴포넌트의 self-reference(memi-board/runtime, /storage)는 build가 만든
      # dist 선언 파일을 해석하므로 깨끗한 runner에서는 build 후 검사해야 한다.
      - name: Typecheck
        run: pnpm typecheck

      - name: Test internationalization options
        run: node --test tests/i18n-options.test.mjs

      - name: Test popup translations and unsaved changes
        run: node --experimental-strip-types --test tests/footer-i18n.test.mjs tests/unsaved-changes.test.mjs

      - name: Test member management, account confirmation, and post lookup
        run: node --experimental-strip-types --test tests/account-deletion-confirm.test.mjs tests/profile-name-moderation.test.mjs tests/user-directory-page.test.mjs tests/post-slug-auth.test.mjs

      - name: Test post list cache
        run: node --experimental-strip-types --test tests/post-list-cache.test.mjs

      - name: Test AI usage counters
        run: node --experimental-strip-types --test tests/ai-usage.test.mjs

      - name: Test post image prompt
        run: node --experimental-strip-types --test tests/post-image-generation.test.mjs

      - name: Test report workflow
        run: node --test tests/report-workflow.test.mjs

      - name: Test orphan cleanup
        run: pnpm test:cleanup

      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Test report and comment moderation security rules
        run: npx --yes firebase-tools@15.25.1 emulators:exec --project demo-memi-review --only firestore 'node tests/report-rules.mjs'

      - name: Test Firebase cleanup security rules
        run: npx --yes firebase-tools@15.25.1 emulators:exec --project demo-memi-cleanup-security --only auth,firestore,storage 'node --test tests/cleanup-rules.test.mjs'

      - name: Test Firebase notice security rules
        run: npx --yes firebase-tools@15.25.1 emulators:exec --project demo-memi-notice-rules --only auth,firestore 'node --test tests/notice-rules.test.mjs'

      - name: Test post URL reservations
        run: npx --yes firebase-tools@15.25.1 emulators:exec --project demo-memi-post-slugs --only auth,firestore 'node --experimental-strip-types --test tests/post-slug.test.mjs'

      - name: Test post and comment edit history security rules
        run: npx --yes firebase-tools@15.25.1 emulators:exec --project demo-memi-revisions --only auth,firestore 'node --test tests/revision-rules.test.mjs'

      - name: Test public profile security rules
        run: npx --yes firebase-tools@15.25.1 emulators:exec --project demo-memi-profile-rules --only auth,firestore 'node --test tests/profile-rules.test.mjs'

      - name: Test content limit security rules
        run: npx --yes firebase-tools@15.25.1 emulators:exec --project demo-memi-limits --only auth,firestore,storage 'node --test tests/limits-rules.test.mjs'

      - name: Test AI usage security rules
        run: npx --yes firebase-tools@15.25.1 emulators:exec --project demo-memi-ai-usage --only auth,firestore 'node --test tests/ai-usage-rules.test.mjs'

      - name: Inspect package
        run: npm pack --dry-run --ignore-scripts

      - name: Publish with npm Trusted Publishing
        run: npm publish --access public --ignore-scripts
